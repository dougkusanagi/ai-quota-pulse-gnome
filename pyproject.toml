[project]
name = "chatgpt-usage-widget"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Douglas Lopes", email = "dl.aguiar@yahoo.com.br" }
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "pillow>=12.3.0",
]

[project.scripts]
chatgpt-usage-widget = "chatgpt_usage_widget:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
