[project]
name = "chatgpt-usage-widget"
version = "0.1.0"
description = "Compact Windows widget for ChatGPT usage and reset times"
readme = "README.md"
authors = [
    { name = "Douglas Lopes", email = "dl.aguiar@yahoo.com.br" }
]
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.7.0",
    "pillow>=12.3.0",
]

[project.scripts]
chatgpt-usage-widget = "chatgpt_usage_widget:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyinstaller>=6.21.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
